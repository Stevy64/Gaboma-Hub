{% load hub_tags %}<div class="discovery-sections">{% for rail in discovery_rails %}{% if rail.apps %}<section class="discovery-section" aria-labelledby="{{ rail.id }}-title"><div class="section-rule"><span>{{ forloop.counter|stringformat:"02d" }} / DÉCOUVRIR</span><span></span></div><div class="rail-heading"><div><h2 id="{{ rail.id }}-title">{{ rail.title }}</h2><p>{{ rail.subtitle }}</p></div><div class="rail-controls" data-carousel-controls hidden><button type="button" data-carousel="{{ rail.id }}" data-direction="-1" aria-label="Applications précédentes : {{ rail.title }}" aria-controls="{{ rail.id }}">{% ui_icon 'chevron-left' %}</button><button type="button" data-carousel="{{ rail.id }}" data-direction="1" aria-label="Applications suivantes : {{ rail.title }}" aria-controls="{{ rail.id }}">{% ui_icon 'chevron-right' %}</button></div></div><div class="app-rail" id="{{ rail.id }}" tabindex="0" role="region" aria-label="{{ rail.title }} : applications à faire défiler">{% for app in rail.apps %}{% include 'hub/_app_card.html' with app=app %}{% endfor %}</div></section>{% endif %}{% endfor %}</div>
