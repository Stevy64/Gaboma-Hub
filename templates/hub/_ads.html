{% if advertisements %}<aside class="advertising-zone" aria-label="Publicités">{% for ad in advertisements %}<article class="advertisement"><div class="ad-label"><span>Publicité{% if ad.sponsor %} · {{ ad.sponsor }}{% endif %}</span><span>Partenaire du hub</span></div>{% if ad.target_url %}<a class="ad-visual" href="{{ ad.target_url }}" target="_blank" rel="sponsored noopener noreferrer"><img src="{{ ad.image.url }}" alt="{{ ad.title }}" loading="lazy"></a>{% else %}<div class="ad-visual"><img src="{{ ad.image.url }}" alt="{{ ad.title }}" loading="lazy"></div>{% endif %}</article>{% endfor %}</aside>{% endif %}
