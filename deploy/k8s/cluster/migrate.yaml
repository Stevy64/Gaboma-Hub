apiVersion: batch/v1
kind: Job
metadata:
  name: hub-migrate
  namespace: hub
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/stevy64/gaboma-hub:main
          imagePullPolicy: Always
          workingDir: /app
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: hub
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
