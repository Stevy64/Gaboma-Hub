name: Test and publish Gaboma Hub
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: docker run --rm -v "$PWD/deploy/k8s:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /manifests/namespace.json /manifests/infra.json /manifests/migration.json /manifests/web.json /manifests/ingress.json
      - name: Validate and start development stack
        run: |
          HUB_ENV_FILE=.env.production.example POSTGRES_PASSWORD=ci-placeholder docker compose --env-file .env.production.example -f compose.yaml config --quiet
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.dev.yaml up -d --build --wait --wait-timeout 180
      - name: Tests with PostgreSQL and Redis
        run: |
          docker compose -f compose.dev.yaml exec -T web python manage.py test hub config --verbosity 1
          docker compose -f compose.dev.yaml exec -T web python manage.py makemigrations --check --dry-run
          curl --fail http://localhost:8010/health/ready/
          curl --fail http://localhost:8010/manifest.webmanifest > /dev/null
          curl --fail http://localhost:8010/sw.js > /dev/null
      - name: Build production image and check deployment settings
        run: |
          docker build -t hub-ci .
          docker run --rm -e DEBUG=false -e SECRET_KEY=ci-only-long-random-placeholder-not-for-production-1234567890 -e ALLOWED_HOSTS=localhost hub-ci python manage.py check --deploy --fail-level WARNING
      - name: Production Gunicorn smoke test
        run: |
          docker run -d --name hub-smoke -p 127.0.0.1:8002:8000 -e DEBUG=false -e SECRET_KEY=ci-only-long-random-placeholder-not-for-production-1234567890 -e ALLOWED_HOSTS=localhost,127.0.0.1 hub-ci
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8002/health/live/; then exit 0; fi
            sleep 2
          done
          docker logs hub-smoke
          exit 1
      - name: Logs
        if: failure()
        run: docker compose -f compose.dev.yaml logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: |
          docker rm -f hub-smoke || true
          docker compose -f compose.dev.yaml down -v
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          provenance: true
          sbom: true
